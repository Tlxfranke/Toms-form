<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0b0b0c">
<title>Toms Form</title>
<meta name="apple-mobile-web-app-title" content="Form">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* VOICE: sportlich, knapp, motivierend – eine App, kein Dokument
   IDEA: Cockpit/Startnummer – große Zahlen, kräftige Karten, ein Signal-Akzent
   PICTURE: der Home-Screen selbst; die Tagesform-Ringkarte als Blickfang
   COLOUR+TYPE: fast schwarz, Karten anthrazit, Akzent Signal-Orange, Erholung Türkis; Barlow Condensed + Barlow
   LAYOUT: eine Spalte, Kartenraster 2-spaltig, Plus-Button unten rechts im Daumenbereich */
:root{color-scheme:dark;--bg:#0b0b0c;--card:#161618;--card2:#202024;--line:#2a2a2f;--ink:#f5f5f3;--mute:#8d8d93;--acc:#ff5a36;--acc2:#2fd4c0;
--spring:cubic-bezier(.32,.72,0,1);--soft:cubic-bezier(.3,1.1,.6,1);--ease:cubic-bezier(.2,.8,.2,1);
--st:env(safe-area-inset-top,0px);--sb:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;min-width:0;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Barlow,system-ui,sans-serif;overflow-x:clip;-webkit-user-select:none;user-select:none;overscroll-behavior:none}
h1,h2,h3,.num{font-family:"Barlow Condensed",Barlow,sans-serif;margin:0;line-height:1.05}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:focus-visible{outline:2px solid var(--acc);outline-offset:3px}
#home{padding:calc(var(--st) + 22px) 16px calc(var(--sb) + 110px);max-width:560px;margin:0 auto;transition:transform .5s var(--spring),opacity .4s var(--ease),filter .4s;transform-origin:50% 30%}
body.open #home{transform:scale(.93);opacity:.35;filter:blur(2px)}
.top{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:18px}
.date{color:var(--mute);font-size:14px;font-weight:500}
.top h1{font-size:38px;font-weight:800;letter-spacing:-.01em}
.av{width:44px;height:44px;border-radius:50%;background:var(--card2);display:grid;place-items:center;font:700 18px "Barlow Condensed";color:var(--acc)}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.card{position:relative;background:var(--card);border-radius:22px;padding:16px;min-height:150px;text-align:left;display:flex;flex-direction:column;overflow:hidden;transition:transform .55s var(--soft),background .35s var(--ease)}
.card.down{transform:scale(.975);transition:transform .22s var(--ease),background .22s;background:#1a1a1d}
.card.wide{grid-column:span 2;min-height:120px}
.card .ic{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;background:var(--card2);margin-bottom:auto}
.card .ic svg{width:19px;height:19px}
.card .num{font-size:40px;font-weight:700;margin-top:14px}
.card .lbl{font-weight:600;font-size:16px}
.card .hint{color:var(--mute);font-size:13px}
.hero{grid-column:span 2;min-height:200px;flex-direction:row;align-items:center;gap:18px;background:linear-gradient(140deg,#24130e,#161618 60%)}
.hero .txt{flex:1}
.hero h2{font-size:30px;font-weight:800}
.ring{width:128px;height:128px;flex:none;position:relative}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .c{position:absolute;inset:0;display:grid;place-items:center;text-align:center}
.ring .c b{font:800 38px/1 "Barlow Condensed"}
.ring .c small{display:block;color:var(--mute);font-size:12px}
.arc{transition:stroke-dashoffset 1.4s var(--spring)}
.tag{display:inline-block;font-size:12px;font-weight:600;color:var(--acc);background:#ff5a361f;border-radius:99px;padding:3px 9px;margin-bottom:8px}
.sec{margin:26px 4px 10px;font:700 15px Barlow;color:var(--mute)}
.note{color:#5d5d63;font-size:13px;text-align:center;margin-top:26px}
/* Plus-Button */
#fab{position:fixed;right:20px;bottom:calc(var(--sb) + 22px);width:64px;height:64px;border-radius:50%;background:var(--acc);display:grid;place-items:center;box-shadow:0 10px 30px #ff5a3666;transition:transform .55s var(--soft);z-index:5}
#fab.down{transform:scale(.93);transition:transform .2s var(--ease)}
#fab svg{width:28px;height:28px}
body.open #fab{transform:scale(0)}
/* Detailansicht */
#det{position:fixed;inset:0;background:var(--bg);overflow-y:auto;-webkit-overflow-scrolling:touch;visibility:hidden;z-index:10;overscroll-behavior:contain}
#det.on{visibility:visible}
.dh{position:sticky;top:0;z-index:2;padding:calc(var(--st) + 10px) 16px 10px;display:flex;align-items:center;gap:10px;background:#0b0b0cdd;-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px)}
.back{width:44px;height:44px;border-radius:50%;background:var(--card2);display:grid;place-items:center;transition:transform .5s var(--soft)}
.back.down{transform:scale(.93);transition:transform .2s var(--ease)}
.back svg{width:20px;height:20px}
.dh .small{font:700 20px "Barlow Condensed";opacity:0;transform:translateY(8px);transition:.3s var(--ease)}
#det.scrolled .dh .small{opacity:1;transform:none}
.grab{width:40px;height:5px;border-radius:3px;background:#3a3a40;margin:0 auto}
.db{padding:6px 16px calc(var(--sb) + 40px);max-width:560px;margin:0 auto}
.db>*{opacity:0;transform:translateY(14px)}
#det.ready .db>*{opacity:1;transform:none;transition:opacity .4s var(--ease),transform .55s var(--spring)}
.big{font-size:46px;font-weight:800;margin:6px 0 4px}
.sub{color:var(--mute);margin:0 0 20px}
.panel{background:var(--card);border-radius:20px;padding:18px;margin-bottom:12px}
.panel h3{font-size:20px;font-weight:700;margin-bottom:12px}
.sk{height:12px;border-radius:6px;margin:10px 0;background:linear-gradient(90deg,#222226 0,#2e2e33 50%,#222226 100%);background-size:200% 100%;animation:sh 1.6s linear infinite}
@keyframes sh{to{background-position:-200% 0}}
.row{display:flex;align-items:center;gap:14px;padding:12px 0;border-top:1px solid var(--line)}
.row:first-of-type{border-top:0}
.row .t{font:700 22px "Barlow Condensed";width:56px;color:var(--acc);white-space:nowrap}
.row .f{flex:1}
.cta{width:100%;height:58px;border-radius:18px;background:var(--acc);font-weight:600;font-size:17px;margin-top:8px;transition:transform .55s var(--soft),opacity .3s}
.cta.down{transform:scale(.98);opacity:.85;transition:transform .2s var(--ease),opacity .2s}
.seg{position:relative;display:grid;grid-template-columns:repeat(3,1fr);background:var(--card);border-radius:14px;padding:4px;margin-bottom:14px}
.seg i{position:absolute;top:4px;bottom:4px;left:4px;width:calc((100% - 8px)/3);border-radius:11px;background:var(--card2);transition:transform .5s var(--spring)}
.seg button{position:relative;height:40px;font-weight:600;color:var(--mute);transition:color .2s}
.seg button.on{color:var(--ink)}
.bars{display:flex;align-items:flex-end;gap:6px;height:180px}
.bars div{flex:1;border-radius:6px 6px 3px 3px;background:var(--acc);transform-origin:bottom;transition:height .7s var(--spring)}
.bars div:nth-child(odd){background:#ff5a36aa}
.ax{display:flex;justify-content:space-between;color:var(--mute);font-size:12px;margin-top:8px}
/* Sheet */
#scrim{position:fixed;inset:0;background:#000a;opacity:0;pointer-events:none;transition:opacity .35s;z-index:20}
#scrim.on{opacity:1;pointer-events:auto}
#sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;background:#18181b;border-radius:28px 28px 0 0;padding:10px 16px calc(var(--sb) + 20px);transform:translateY(105%);transition:transform .55s var(--spring);max-width:560px;margin:0 auto;touch-action:none}
#sheet.on{transform:none}
#sheet h3{font-size:24px;font-weight:800;margin:16px 4px 14px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{height:96px;border-radius:20px;background:var(--card2);display:flex;flex-direction:column;justify-content:space-between;align-items:flex-start;padding:14px;font-weight:600;transition:transform .55s var(--soft),background .3s}
.tile.down{transform:scale(.97);background:#26262b;transition:transform .2s var(--ease),background .2s}
.tile svg{width:24px;height:24px}
#toast{position:fixed;left:50%;top:calc(var(--st) + 14px);transform:translate(-50%,-150%);background:#26262b;padding:12px 18px;border-radius:16px;font-weight:500;font-size:15px;z-index:30;transition:transform .5s var(--spring);white-space:nowrap}
#toast.on{transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){*{transition-duration:.01s!important;animation:none!important}}
</style>
</head>
<body>
<main id="home">
  <div class="top">
    <div><div class="date" id="date"></div><h1 id="hi">Hallo, Tom</h1></div>
    <div class="av">T</div>
  </div>
  <div class="grid" id="grid"></div>
  <p class="note">Version 0.1 · Inhalte folgen</p>
</main>

<button id="fab" aria-label="Schnell eintragen"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>

<section id="det" aria-modal="true" role="dialog"></section>

<div id="scrim"></div>
<div id="sheet" role="dialog" aria-label="Schnell eintragen">
  <div class="grab"></div>
  <h3>Schnell eintragen</h3>
  <div class="tiles" id="tiles"></div>
</div>
<div id="toast"></div>
<label id="hap" style="position:absolute;left:-999px;opacity:0"><input type="checkbox" switch></label>

<script>
{
const I={
  bolt:'<path d="M13 3 5 14h6l-1 7 8-11h-6l1-7z"/>',
  food:'<path d="M7 3v8a2 2 0 0 0 2 2v8M7 3v5M11 3v5M17 3c-2 2-2 6 0 8v10"/>',
  dumb:'<path d="M6 7v10M3 9v6M18 7v10M21 9v6M6 12h12"/>',
  moon:'<path d="M20 14.5A8 8 0 0 1 9.5 4 8 8 0 1 0 20 14.5z"/>',
  cal:'<rect x="4" y="5" width="16" height="15" rx="3"/><path d="M4 10h16M9 3v4M15 3v4"/>',
  chart:'<path d="M5 20V10M12 20V4M19 20v-7"/>',
  heart:'<path d="M12 20s-7-4.5-7-10a4 4 0 0 1 7-2.5A4 4 0 0 1 19 10c0 5.5-7 10-7 10z"/>',
  scale:'<rect x="4" y="4" width="16" height="16" rx="4"/><path d="M9 9a4 4 0 0 1 6 0l-3 3"/>',
  note:'<path d="M5 4h10l4 4v12H5zM9 12h6M9 16h4"/>',
  back:'<path d="M15 5l-7 7 7 7"/>',
  down:'<path d="M6 9l6 6 6-6"/>'
};
const ico=(k,c='currentColor')=>`<svg viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${I[k]}</svg>`;

// Bereiche: "type" bestimmt, wie sich der Bereich verhält
// glance = kurz draufschauen + abhaken · read = in Ruhe lesen · data = Verläufe ansehen
const AREAS=[
  {id:'heute',type:'glance',title:'Heute',hero:true,icon:'bolt',col:'#ff5a36',hint:'Dein Tag auf einen Blick'},
  {id:'essen',type:'glance',title:'Ernährung',icon:'food',col:'#ff5a36',hint:'Nächste Mahlzeit'},
  {id:'training',type:'glance',title:'Training',icon:'dumb',col:'#ff5a36',hint:'Nächste Einheit'},
  {id:'recovery',type:'glance',title:'Recovery',icon:'moon',col:'#2fd4c0',hint:'Erholung & Schlaf'},
  {id:'plan',type:'read',title:'Trainingsplan',icon:'cal',col:'#f5f5f3',hint:'Deine Woche'},
  {id:'daten',type:'data',title:'Verläufe',icon:'chart',col:'#ff5a36',hint:'Statistik'},
  {id:'koerper',type:'data',title:'Körper',icon:'heart',col:'#2fd4c0',hint:'Gesundheitswerte'}
];
const TILES=[['food','Mahlzeit'],['dumb','Training'],['scale','Gewicht'],['note','Notiz']];

const $=s=>document.querySelector(s);
const grid=$('#grid'),det=$('#det'),sheet=$('#sheet'),scrim=$('#scrim'),toast=$('#toast'),hap=$('#hap');

// Begrüßung nach Uhrzeit
const now=new Date(),h=now.getHours();
$('#date').textContent=now.toLocaleDateString('de-DE',{weekday:'long',day:'numeric',month:'long'});
$('#hi').textContent=(h<11?'Guten Morgen':h<17?'Hallo':h<22?'Guten Abend':'Gute Nacht')+', Tom';

// Haptik-Versuch (iOS 18+ Schalter-Trick, sonst still)
const buzz=()=>{try{navigator.vibrate&&navigator.vibrate(8)}catch(e){}try{hap.click()}catch(e){}};

const R=2*Math.PI*52;
grid.innerHTML=AREAS.map(a=>a.hero?`
  <button class="card hero" data-id="${a.id}">
    <div class="txt"><span class="tag">Beispiel</span><h2>${a.title}</h2><div class="hint">${a.hint}</div></div>
    <div class="ring"><svg viewBox="0 0 120 120"><circle cx="60" cy="60" r="52" fill="none" stroke="#2a2a2f" stroke-width="11"/>
      <circle class="arc" cx="60" cy="60" r="52" fill="none" stroke="var(--acc)" stroke-width="11" stroke-linecap="round" stroke-dasharray="${R}" stroke-dashoffset="${R}"/></svg>
      <div class="c"><div><b>–</b><small>Tagesform</small></div></div></div>
  </button>`:`
  <button class="card${a.wide?' wide':''}" data-id="${a.id}">
    <div class="ic">${ico(a.icon,a.col)}</div>
    <div class="num">–</div>
    <div class="lbl">${a.title}</div><div class="hint">${a.hint}</div>
  </button>`).join('');
requestAnimationFrame(()=>setTimeout(()=>{const arc=$('.arc');if(arc)arc.style.strokeDashoffset=R*.3},250));

$('#tiles').innerHTML=TILES.map(([k,t])=>`<button class="tile" data-t="${t}">${ico(k,'var(--acc)')}${t}</button>`).join('');

// Gedrückt-Gefühl: einfedern beim Antippen, zurückfedern beim Loslassen
const pressSel='.card,.tile,.cta,.back,#fab';
document.addEventListener('pointerdown',e=>{const el=e.target.closest(pressSel);if(el)el.classList.add('down')});
['pointerup','pointercancel','pointerleave'].forEach(t=>document.addEventListener(t,()=>document.querySelectorAll('.down').forEach(x=>x.classList.remove('down')),true));
document.addEventListener('scroll',()=>document.querySelectorAll('.down').forEach(x=>x.classList.remove('down')),true);

const sk=n=>Array.from({length:n},(_,i)=>`<div class="sk" style="width:${[92,70,84,58,76][i%5]}%"></div>`).join('');
const body={
  glance:a=>`
    <div class="panel"><h3>Jetzt dran</h3><div class="num big" style="color:${a.col}">–</div>${sk(2)}</div>
    <div class="panel"><h3>Danach</h3>
      ${['08:00','12:30','16:00'].map(t=>`<div class="row"><div class="t">${t}</div><div class="f">${sk(1)}</div></div>`).join('')}</div>
    <button class="cta" data-toast="Erledigt ✓">Erledigt</button>`,
  read:a=>['Montag','Dienstag','Mittwoch','Donnerstag','Freitag','Samstag','Sonntag'].map(d=>`
    <div class="panel"><h3>${d}</h3>${sk(4)}</div>`).join(''),
  data:a=>`
    <div class="seg" id="seg"><i></i>${['Woche','Monat','Jahr'].map((s,i)=>`<button class="${i?'':'on'}" data-i="${i}">${s}</button>`).join('')}</div>
    <div class="panel"><h3>Verlauf</h3><div class="bars" id="bars">${Array.from({length:12},()=>'<div style="height:4%"></div>').join('')}</div>
      <div class="ax"><span>Start</span><span>Heute</span></div></div>
    <div class="panel"><h3>Auswertung</h3>${sk(5)}</div>`
};
const shuffleBars=()=>document.querySelectorAll('#bars div').forEach((b,i)=>{b.style.transitionDelay=i*25+'ms';b.style.height=(20+Math.random()*75)+'%'});

let from=null;
const clipOf=r=>`inset(${r.top}px ${innerWidth-r.right}px ${innerHeight-r.bottom}px ${r.left}px round 22px)`;

function openArea(card){
  const a=AREAS.find(x=>x.id===card.dataset.id);
  buzz();
  det.innerHTML=`<div class="dh"><button class="back" aria-label="Zurück">${ico(a.type==='read'?'back':'down')}</button><div class="small">${a.title}</div></div>
    <div class="db"><h1 class="big">${a.title}</h1><p class="sub">${a.hint} · Platzhalter</p>${body[a.type](a)}</div>`;
  from=card;
  det.className='on';det.scrollTop=0;det.style.transform='';
  det.style.transition='none';det.style.clipPath=clipOf(card.getBoundingClientRect());
  det.offsetHeight;
  det.style.transition='clip-path .55s var(--spring)';det.style.clipPath='inset(0px 0px 0px 0px round 0px)';
  document.body.classList.add('open');
  setTimeout(()=>{det.classList.add('ready');if(a.type==='data')shuffleBars()},120);
}
function closeArea(){
  if(!from)return;
  buzz();
  det.classList.remove('ready','scrolled');
  det.style.transition='clip-path .5s var(--spring),transform .5s var(--spring)';
  det.style.transform='';
  det.style.clipPath=clipOf(from.getBoundingClientRect());
  document.body.classList.remove('open');
  const done=()=>{det.className='';det.innerHTML='';from=null};
  setTimeout(done,480);
}

grid.addEventListener('click',e=>{const c=e.target.closest('.card');if(c)openArea(c)});
det.addEventListener('click',e=>{
  if(e.target.closest('.back'))return closeArea();
  const t=e.target.closest('[data-toast]');if(t){buzz();showToast(t.dataset.toast);return}
  const s=e.target.closest('.seg button');
  if(s){buzz();const seg=$('#seg');seg.querySelectorAll('button').forEach(b=>b.classList.toggle('on',b===s));
    seg.querySelector('i').style.transform=`translateX(${s.dataset.i*100}%)`;shuffleBars()}
});
det.addEventListener('scroll',()=>det.classList.toggle('scrolled',det.scrollTop>50));

// Nach unten ziehen (ganz oben) schließt die Detailansicht
let y0=null,dy=0;
det.addEventListener('touchstart',e=>{y0=det.scrollTop<=0?e.touches[0].clientY:null;dy=0},{passive:true});
det.addEventListener('touchmove',e=>{
  if(y0===null)return;dy=e.touches[0].clientY-y0;
  if(dy>0){e.preventDefault();det.style.transition='none';det.style.transform=`translateY(${dy*.55}px) scale(${1-Math.min(dy,400)/2500})`;det.style.clipPath=`inset(0px round ${Math.min(dy/6,28)}px)`}
},{passive:false});
det.addEventListener('touchend',()=>{
  if(y0===null)return;y0=null;
  if(dy>110)closeArea();
  else{det.style.transition='transform .5s var(--spring),clip-path .5s var(--spring)';det.style.transform='';det.style.clipPath='inset(0px round 0px)'}
});

// Schnell-Eintragen-Sheet
const openSheet=()=>{buzz();sheet.style.transform='';sheet.classList.add('on');scrim.classList.add('on')};
const closeSheet=()=>{sheet.style.transition='';sheet.style.transform='';sheet.classList.remove('on');scrim.classList.remove('on')};
$('#fab').addEventListener('click',openSheet);
scrim.addEventListener('click',closeSheet);
$('#tiles').addEventListener('click',e=>{const t=e.target.closest('.tile');if(!t)return;buzz();closeSheet();setTimeout(()=>showToast(t.dataset.t+' – kommt später'),250)});
let s0=null,sd=0;
sheet.addEventListener('pointerdown',e=>{if(e.target.closest('.tile'))return;s0=e.clientY;sd=0;sheet.setPointerCapture(e.pointerId)});
sheet.addEventListener('pointermove',e=>{if(s0===null)return;sd=Math.max(0,e.clientY-s0);sheet.style.transition='none';sheet.style.transform=`translateY(${sd}px)`});
sheet.addEventListener('pointerup',()=>{if(s0===null)return;s0=null;sheet.style.transition='';if(sd>80)closeSheet();else sheet.style.transform=''});

let tt;
function showToast(m){toast.textContent=m;toast.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>toast.classList.remove('on'),1800)}
}
</script>
<script>if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}))</script>
</body>
</html>
