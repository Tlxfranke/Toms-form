<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0b0b0c">
<title>Toms Form</title>
<meta name="apple-mobile-web-app-title" content="Form">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* VOICE: sportlich, knapp, motivierend – eine App, kein Dokument
   IDEA: Cockpit/Startnummer – große Zahlen, kräftige Karten, ein Signal-Akzent
   PICTURE: der Home-Screen selbst; die Tagesform-Ringkarte als Blickfang
   COLOUR+TYPE: fast schwarz, Karten anthrazit, Akzent Signal-Orange, Erholung Türkis; Barlow Condensed + Barlow
   LAYOUT: eine Spalte, Kartenraster 2-spaltig, Plus-Button unten rechts im Daumenbereich */
:root{color-scheme:dark;--bg:#0b0b0c;--card:#161618;--card2:#202024;--line:#2a2a2f;--ink:#f5f5f3;--mute:#8d8d93;--acc:#ff5a36;--acc2:#2fd4c0;
--spring:cubic-bezier(.32,.72,0,1);--soft:cubic-bezier(.3,1.1,.6,1);--ease:cubic-bezier(.2,.8,.2,1);
--st:env(safe-area-inset-top,0px);--sb:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;min-width:0;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Barlow,system-ui,sans-serif;overflow-x:clip;-webkit-user-select:none;user-select:none;overscroll-behavior:none}
h1,h2,h3,.num{font-family:"Barlow Condensed",Barlow,sans-serif;margin:0;line-height:1.05}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:focus-visible{outline:2px solid var(--acc);outline-offset:3px}
#home{padding:calc(var(--st) + 22px) 16px calc(var(--sb) + 110px);max-width:560px;margin:0 auto;transition:transform .5s var(--spring),opacity .4s var(--ease),filter .4s;transform-origin:50% 30%}
body.open #home{transform:scale(.93);opacity:.35;filter:blur(2px)}
.top{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:18px}
.date{color:var(--mute);font-size:14px;font-weight:500}
.top h1{font-size:38px;font-weight:800;letter-spacing:-.01em}
.av{width:44px;height:44px;border-radius:50%;background:var(--card2);display:grid;place-items:center;font:700 18px "Barlow Condensed";color:var(--acc)}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.card{position:relative;background:var(--card);border-radius:22px;padding:16px;min-height:150px;text-align:left;display:flex;flex-direction:column;overflow:hidden;transition:transform .55s var(--soft),background .35s var(--ease)}
.card.down{transform:scale(.975);transition:transform .22s var(--ease),background .22s;background:#1a1a1d}
.card.wide{grid-column:span 2;min-height:120px}
.card .ic{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;background:var(--card2);margin-bottom:auto}
.card .ic svg{width:19px;height:19px}
.card .num{font-size:40px;font-weight:700;margin-top:14px}
.card .lbl{font-weight:600;font-size:16px}
.card .hint{color:var(--mute);font-size:13px}
.hero{grid-column:span 2;min-height:200px;flex-direction:row;align-items:center;gap:18px;background:linear-gradient(140deg,#0e2421,#161618 60%)}
.hero .tag{color:var(--acc2);background:#2fd4c01f}
.hero .txt{flex:1}
.hero h2{font-size:30px;font-weight:800}
.ring{width:128px;height:128px;flex:none;position:relative}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .c{position:absolute;inset:0;display:grid;place-items:center;text-align:center}
.ring .c b{font:800 38px/1 "Barlow Condensed"}
.ring .c small{display:block;color:var(--mute);font-size:12px}
.arc{transition:stroke-dashoffset 1.5s cubic-bezier(.22,1,.36,1)}
.tag{display:inline-block;font-size:12px;font-weight:600;color:var(--acc);background:#ff5a361f;border-radius:99px;padding:3px 9px;margin-bottom:8px}
.sec{margin:26px 4px 10px;font:700 15px Barlow;color:var(--mute)}
.note{color:#5d5d63;font-size:13px;text-align:center;margin-top:26px}
/* Plus-Button */
#fab{position:fixed;right:20px;bottom:calc(var(--sb) + 22px);width:64px;height:64px;border-radius:50%;background:var(--acc);display:grid;place-items:center;box-shadow:0 10px 30px #ff5a3666;transition:transform .55s var(--soft);z-index:5}
#fab.down{transform:scale(.93);transition:transform .2s var(--ease)}
#fab svg{width:28px;height:28px}
body.open #fab{transform:scale(0)}
/* Detailansicht */
#det{position:fixed;inset:0;background:var(--bg);overflow-y:auto;-webkit-overflow-scrolling:touch;visibility:hidden;z-index:10;overscroll-behavior:contain}
#det.on{visibility:visible}
.dh{position:sticky;top:0;z-index:2;padding:calc(var(--st) + 10px) 16px 10px;display:flex;align-items:center;gap:10px;background:#0b0b0cdd;-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px)}
.back{width:44px;height:44px;border-radius:50%;background:var(--card2);display:grid;place-items:center;transition:transform .5s var(--soft)}
.back.down{transform:scale(.93);transition:transform .2s var(--ease)}
.back svg{width:20px;height:20px}
.dh .small{font:700 20px "Barlow Condensed";opacity:0;transform:translateY(8px);transition:.3s var(--ease)}
#det.scrolled .dh .small{opacity:1;transform:none}
.grab{width:40px;height:5px;border-radius:3px;background:#3a3a40;margin:0 auto}
.db{padding:6px 16px calc(var(--sb) + 40px);max-width:560px;margin:0 auto}
.db>*{opacity:0;transform:translateY(14px)}
#det.ready .db>*{opacity:1;transform:none;transition:opacity .4s var(--ease),transform .55s var(--spring)}
.big{font-size:46px;font-weight:800;margin:6px 0 4px}
.sub{color:var(--mute);margin:0 0 20px}
.panel{background:var(--card);border-radius:20px;padding:18px;margin-bottom:12px}
.panel h3{font-size:20px;font-weight:700;margin-bottom:12px}
.sk{height:12px;border-radius:6px;margin:10px 0;background:linear-gradient(90deg,#222226 0,#2e2e33 50%,#222226 100%);background-size:200% 100%;animation:sh 1.6s linear infinite}
@keyframes sh{to{background-position:-200% 0}}
.row{display:flex;align-items:center;gap:14px;padding:12px 0;border-top:1px solid var(--line)}
.row:first-of-type{border-top:0}
.row .t{font:700 22px "Barlow Condensed";width:56px;color:var(--acc);white-space:nowrap}
.row .f{flex:1}
.cta{width:100%;height:58px;border-radius:18px;background:var(--acc);font-weight:600;font-size:17px;margin-top:8px;transition:transform .55s var(--soft),opacity .3s}
.cta.down{transform:scale(.98);opacity:.85;transition:transform .2s var(--ease),opacity .2s}
.seg{position:relative;display:grid;grid-template-columns:repeat(3,1fr);background:var(--card);border-radius:14px;padding:4px;margin-bottom:14px}
.seg i{position:absolute;top:4px;bottom:4px;left:4px;width:calc((100% - 8px)/3);border-radius:11px;background:var(--card2);transition:transform .5s var(--spring)}
.seg button{position:relative;height:40px;font-weight:600;color:var(--mute);transition:color .2s}
.seg button.on{color:var(--ink)}
.bars{display:flex;align-items:flex-end;gap:6px;height:180px}
.bars div{flex:1;border-radius:6px 6px 3px 3px;background:var(--acc);transform-origin:bottom;transition:height .7s var(--spring)}
.bars div:nth-child(odd){background:#ff5a36aa}
.ax{display:flex;justify-content:space-between;color:var(--mute);font-size:12px;margin-top:8px}
/* Sheet */
#scrim{position:fixed;inset:0;background:#000a;opacity:0;pointer-events:none;transition:opacity .35s;z-index:20}
#scrim.on{opacity:1;pointer-events:auto}
#sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;background:#18181b;border-radius:28px 28px 0 0;padding:10px 16px calc(var(--sb) + 20px);transform:translateY(105%);transition:transform .55s var(--spring);max-width:560px;margin:0 auto;max-height:88vh;overflow-y:auto;overscroll-behavior:contain}
#sheet .grab{touch-action:none;padding:8px 0;margin-top:-8px;width:80px;background-clip:content-box}
#sheet .panel{background:transparent;padding:6px 2px}
#sheet.on{transform:none}
#sheet h3{font-size:24px;font-weight:800;margin:16px 4px 14px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{height:96px;border-radius:20px;background:var(--card2);display:flex;flex-direction:column;justify-content:space-between;align-items:flex-start;padding:14px;font-weight:600;transition:transform .55s var(--soft),background .3s}
.tile.down{transform:scale(.97);background:#26262b;transition:transform .2s var(--ease),background .2s}
.tile svg{width:24px;height:24px}
#toast{position:fixed;left:50%;top:calc(var(--st) + 14px);transform:translate(-50%,-150%);background:#26262b;padding:12px 18px;border-radius:16px;font-weight:500;font-size:15px;z-index:30;transition:transform .5s var(--spring);white-space:nowrap}
#toast.on{transform:translate(-50%,0)}
/* Ernährung */
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 4px}
.chips.scroll-x{flex-wrap:nowrap;overflow-x:auto;margin:6px -18px 4px;padding:0 18px 4px;scrollbar-width:none}
.chips.scroll-x::-webkit-scrollbar{display:none}
.chip{flex:none;min-height:40px;padding:0 15px;border-radius:12px;background:var(--card2);font-weight:600;font-size:15px;color:#cfcfd3;transition:transform .5s var(--soft),background .25s,color .25s}
.chip.on{background:var(--acc);color:#fff}
.chip.big{min-height:48px;flex:1 1 40%}
.chip:active{transform:scale(.96);transition:transform .15s}
.ghost{flex:1;height:48px;border-radius:14px;background:var(--card2);font-weight:600;color:#cfcfd3;margin-top:8px;transition:transform .5s var(--soft)}
.ghost:active{transform:scale(.97)}
.row2{display:flex;gap:8px}
.ask .ghost{width:100%}
.cta[disabled]{opacity:.35}
.lbl2{font-size:13px;color:var(--mute);font-weight:600;margin-top:12px}
.mini{color:var(--mute);font-size:14px;margin:6px 0}
.why{color:#c9c9cd;background:#ffffff08;border-radius:12px;padding:10px 12px}
.daychip{width:100%;display:grid;grid-template-columns:1fr auto;text-align:left;background:var(--card);border-radius:16px;padding:12px 16px;margin-bottom:12px;transition:transform .5s var(--soft)}
.daychip:active{transform:scale(.98)}
.daychip span{font-weight:700;font-size:17px}.daychip small{grid-column:1;color:var(--mute);font-size:13px}
.daychip b{grid-row:1/3;grid-column:2;align-self:center;color:var(--acc);font-size:14px;font-weight:600}
.ask{border:1px solid #ff5a3655}
.ask-q{font:700 22px/1.15 "Barlow Condensed",Barlow,sans-serif;margin-bottom:4px}
.ask-b{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.now{background:linear-gradient(160deg,#2a1610,#161618 55%)}
.now-l{color:var(--acc);font-weight:600;font-size:14px}
.now-t{font:800 32px/1.05 "Barlow Condensed",Barlow,sans-serif;margin:2px 0 4px}
.now-c{color:var(--mute);font-size:14px}
.ing{list-style:none;padding:0;margin:14px 0 6px}
.ing li{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-top:1px solid var(--line);font-size:16px}
.ing li:first-child{border-top:0}
.ing li.fill span{color:var(--acc2)}
.ing em{font-style:normal;font-size:12px;font-weight:600;color:var(--acc2);background:#2fd4c01c;border-radius:99px;padding:2px 8px;align-self:center;white-space:nowrap}
.macro{color:var(--mute);font-size:13px;margin-bottom:6px}
.bar{margin:12px 0}
.bar-h{display:flex;justify-content:space-between;font-size:14px;color:var(--mute)}.bar-h b{color:var(--ink)}
.track{position:relative;height:10px;border-radius:5px;background:#26262b;margin:6px 0 3px;overflow:hidden}
.track i{position:absolute;left:0;top:0;bottom:0;border-radius:5px;transition:width 1.2s cubic-bezier(.22,1,.36,1)}
.track .plan{background:#ff5a3640}.track .eat{background:var(--acc)}
.track s{position:absolute;top:0;bottom:0;border-left:2px solid #fff9;border-right:2px solid #fff9;min-width:3px;text-decoration:none}
.bar-f{font-size:12px;color:var(--mute)}.bar-f.warn{color:#ffb199}
.tl{display:flex;gap:14px;padding:11px 0;border-top:1px solid var(--line);align-items:center}
.tl:first-of-type{border-top:0}
.tl-t{font:700 20px "Barlow Condensed";color:var(--acc);width:52px;flex:none}
.tl-b{flex:1;display:flex;flex-direction:column}.tl-b span{color:#bdbdc2;font-size:14px}.tl-b small{color:var(--mute);font-size:12px}
.undo{font-size:13px;color:var(--mute);padding:8px}
.supp{width:100%;display:flex;gap:12px;align-items:center;text-align:left;padding:10px 0;border-top:1px solid var(--line)}
.supp:first-of-type{border-top:0}
.supp i{width:26px;height:26px;border-radius:50%;border:2px solid #44444a;flex:none;transition:.35s var(--soft);display:grid;place-items:center}
.supp.on i{background:var(--acc2);border-color:var(--acc2)}
.supp.on i::after{content:"";width:9px;height:5px;border-left:2.5px solid #0b0b0c;border-bottom:2.5px solid #0b0b0c;transform:rotate(-45deg) translate(1px,-1px)}
.supp span{display:flex;flex-direction:column}.supp small{color:var(--mute);font-size:13px}
.supp.on b{color:var(--mute);text-decoration:line-through}
/* Fortschritt & Recovery */
.step{display:flex;align-items:center;gap:10px;margin:6px 0 2px}
.step button{width:56px;height:56px;border-radius:18px;background:var(--card2);font:700 30px/1 "Barlow Condensed";transition:transform .5s var(--soft)}
.step button:active{transform:scale(.92);transition:transform .12s}
.step b{flex:1;text-align:center;font:800 44px/1 "Barlow Condensed"}.step b small{font-size:20px;color:var(--mute)}
.chips.rpe{display:grid;grid-template-columns:repeat(5,1fr)}
.chips.rpe .chip{min-height:58px;padding:4px 2px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px}
.chips.rpe .chip b{font:800 22px/1 "Barlow Condensed"}.chips.rpe .chip small{font-size:10px;font-weight:600;opacity:.8;line-height:1.1}
.chips.w5{display:grid;grid-template-columns:repeat(5,1fr)}.chips.w5 .chip{padding:0 2px;font-size:13px}
.rec .chip.on{background:var(--acc2);color:#0b0b0c}.rec .cta{background:var(--acc2);color:#0b0b0c}.rec .ask{border-color:#2fd4c055}
.rec .track .rc{background:var(--acc2)}.warn{color:#ffb199}
.seg2{display:flex;gap:8px;margin-bottom:10px}
.kv{text-align:right;display:flex;flex-direction:column}.kv b{font:700 20px "Barlow Condensed"}.kv small{font-size:12px;color:var(--mute)}
.kv .up{color:var(--acc2)}.kv .dn{color:#ffb199}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.kpis div{background:var(--card2);border-radius:14px;padding:10px}.kpis b{display:block;font:800 26px/1 "Barlow Condensed"}.kpis small{color:var(--mute);font-size:11px}
.txtin{width:100%;height:50px;border-radius:14px;border:1px solid var(--line);background:var(--card2);color:var(--ink);font:500 17px Barlow,system-ui;padding:0 14px;-webkit-user-select:text;user-select:text;outline:none}
.txtin:focus{border-color:var(--acc)}
.chip.sz{display:flex;flex-direction:column;align-items:flex-start;justify-content:center;padding:6px 12px;text-align:left}.chip.sz small{font-size:11px;font-weight:500;opacity:.8}
.dayring{display:flex;align-items:center;gap:14px}
.dayring svg{width:46%;max-width:200px;flex:none;transform:rotate(-90deg)}
.legend{flex:1;display:flex;flex-direction:column;gap:8px}
.lg{display:flex;gap:8px;align-items:flex-start;font-size:14px}.lg i{width:10px;height:10px;border-radius:50%;margin-top:5px;flex:none}
.lg b{font:700 18px "Barlow Condensed"}.lg small{display:block;color:var(--mute);font-size:11px;line-height:1.25}.lg small.warn{color:#ffb199}
.src{font-size:13px}.src div{display:grid;grid-template-columns:1fr auto;column-gap:10px;padding:6px 0;border-top:1px solid var(--line)}.src div:first-child{border-top:0}
.src span{color:#cfcfd3}.src b{font-weight:600;text-align:right}.src b::after{content:" kcal";color:var(--mute);font-weight:400;font-size:11px}
.src em{grid-column:1/3;font-style:normal;color:var(--mute);font-size:11px}
.how{background:#ffffff08;border-radius:12px;padding:10px 12px;margin:8px 0}.how summary{font-weight:600;cursor:pointer;color:var(--ink)}.how p{margin:8px 0 0;color:#c9c9cd;font-size:14px;line-height:1.45}
.vid{display:block;text-align:center;padding:11px;border-radius:12px;background:#ff5a361f;color:var(--acc);font-weight:600;text-decoration:none;margin:8px 0}
.snrows{margin:10px 0 4px}
.snrow{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}.snrow:first-child{border-top:0}
.snn{flex:1;display:flex;flex-direction:column}.snn small{color:var(--mute);font-size:12px}
.snq-w{display:flex;align-items:center;gap:6px}.snq-w button{width:38px;height:38px;border-radius:12px;background:var(--card2);font:700 22px/1 "Barlow Condensed"}
.snq-w span{color:var(--mute);font-size:13px;width:22px}
.snq{width:62px;height:38px;border-radius:10px;border:1px solid var(--line);background:#111114;color:var(--ink);font:600 17px Barlow;text-align:center;-webkit-user-select:text;user-select:text;outline:none;-moz-appearance:textfield}
.snq::-webkit-outer-spin-button,.snq::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}.snq:focus{border-color:var(--acc)}
.step.w4 button{width:48px;font-size:20px}.step.w4 b{font-size:38px}
.cta.rc{background:var(--acc2);color:#0b0b0c}
.wchart{width:100%;height:110px;display:block;margin:4px 0 0}
.kpis.k6 div{min-height:62px}
.bars7{display:flex;gap:6px;height:90px;align-items:flex-end;margin:4px 0 8px}
.bars7 div{flex:1;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:4px}
.bars7 i{width:100%;border-radius:5px 5px 2px 2px;background:var(--acc2)}.bars7 small{font-size:11px;color:var(--mute)}
@media (prefers-reduced-motion:reduce){*{transition-duration:.01s!important;animation:none!important}}
</style>
</head>
<body>
<main id="home">
  <div class="top">
    <div><div class="date" id="date"></div><h1 id="hi">Hallo, Tom</h1></div>
    <div class="av">T</div>
  </div>
  <div class="grid" id="grid"></div>
  <p class="note">Version 0.2</p>
</main>

<button id="fab" aria-label="Schnell eintragen"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>

<section id="det" aria-modal="true" role="dialog"></section>

<div id="scrim"></div>
<div id="sheet" role="dialog" aria-label="Schnell eintragen">
  <div class="grab"></div>
  <div id="sheetBody"></div>
</div>
<div id="toast"></div>
<label id="hap" style="position:absolute;left:-999px;opacity:0"><input type="checkbox" switch></label>

<script src="nutrition.js"></script>
<script src="training.js"></script>
<script>
{
const I={
  bolt:'<path d="M13 3 5 14h6l-1 7 8-11h-6l1-7z"/>',
  food:'<path d="M7 3v8a2 2 0 0 0 2 2v8M7 3v5M11 3v5M17 3c-2 2-2 6 0 8v10"/>',
  dumb:'<path d="M6 7v10M3 9v6M18 7v10M21 9v6M6 12h12"/>',
  moon:'<path d="M20 14.5A8 8 0 0 1 9.5 4 8 8 0 1 0 20 14.5z"/>',
  cal:'<rect x="4" y="5" width="16" height="15" rx="3"/><path d="M4 10h16M9 3v4M15 3v4"/>',
  chart:'<path d="M5 20V10M12 20V4M19 20v-7"/>',
  trend:'<path d="M4 17l6-6 4 4 6-7M14 8h6v6"/>',
  heart:'<path d="M12 20s-7-4.5-7-10a4 4 0 0 1 7-2.5A4 4 0 0 1 19 10c0 5.5-7 10-7 10z"/>',
  scale:'<rect x="4" y="4" width="16" height="16" rx="4"/><path d="M9 9a4 4 0 0 1 6 0l-3 3"/>',
  note:'<path d="M5 4h10l4 4v12H5zM9 12h6M9 16h4"/>',
  back:'<path d="M15 5l-7 7 7 7"/>',
  down:'<path d="M6 9l6 6 6-6"/>'
};
const ico=(k,c='currentColor')=>`<svg viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${I[k]}</svg>`;

// Bereiche: "type" bestimmt, wie sich der Bereich verhält
// glance = kurz draufschauen + abhaken · read = in Ruhe lesen · data = Verläufe ansehen
const AREAS=[
  {id:'daten',type:'data',title:'Daten',hero:true,icon:'chart',col:'#2fd4c0',hint:'Schlaf, Stress, Belastung, Gewicht'},
  {id:'essen',type:'glance',title:'Ernährung',icon:'food',col:'#ff5a36',hint:'Nächste Mahlzeit'},
  {id:'training',type:'glance',title:'Training',icon:'dumb',col:'#ff5a36',hint:'Nächste Einheit'},
  {id:'fortschritt',type:'data',title:'Progress',icon:'trend',col:'#ff5a36',hint:'Gym-Progress'},
  {id:'recovery',type:'glance',title:'Recovery',icon:'moon',col:'#2fd4c0',hint:'Erholung & Schlaf'},
  {id:'plan',type:'read',title:'Trainingsplan',icon:'cal',col:'#f5f5f3',hint:'Deine Woche',wide:true}
];
const TILES=[['food','Mahlzeit'],['dumb','Training'],['scale','Gewicht'],['note','Notiz']];

const $=s=>document.querySelector(s);
const grid=$('#grid'),det=$('#det'),sheet=$('#sheet'),scrim=$('#scrim'),toast=$('#toast'),hap=$('#hap');

// Begrüßung nach Uhrzeit
const now=new Date(),h=now.getHours();
$('#date').textContent=now.toLocaleDateString('de-DE',{weekday:'long',day:'numeric',month:'long'});
$('#hi').textContent=(h<11?'Guten Morgen':h<17?'Hallo':h<22?'Guten Abend':'Gute Nacht')+', Tom';

// Haptik-Versuch (iOS 18+ Schalter-Trick, sonst still)
const buzz=()=>{try{navigator.vibrate&&navigator.vibrate(8)}catch(e){}try{hap.click()}catch(e){}};

const R=2*Math.PI*52;
grid.innerHTML=AREAS.map(a=>a.hero?`
  <button class="card hero" data-id="${a.id}">
    <div class="txt"><span class="tag">Zentrale</span><h2>${a.title}</h2><div class="hint" id="hint-${a.id}">${a.hint}</div></div>
    <div class="ring"><svg viewBox="0 0 120 120"><circle cx="60" cy="60" r="52" fill="none" stroke="#2a2a2f" stroke-width="11"/>
      <circle class="arc" id="arc-${a.id}" cx="60" cy="60" r="52" fill="none" stroke="var(--acc2)" stroke-width="11" stroke-linecap="round" stroke-dasharray="${R}" stroke-dashoffset="${R}" data-off="${R}" data-full="${R}"/></svg>
      <div class="c"><div><b id="num-${a.id}">–</b><small>Tagesform</small></div></div></div>
  </button>`:`
  <button class="card${a.wide?' wide':''}" data-id="${a.id}">
    <div class="ic">${ico(a.icon,a.col)}</div>
    <div class="num" id="num-${a.id}">–</div>
    <div class="lbl">${a.title}</div><div class="hint" id="hint-${a.id}">${a.hint}</div>
  </button>`).join('');
// Balken und Ringe laufen beim Öffnen einmal von 0 bis zum aktuellen Stand
function fillIn(root,delay=160){
  const els=[...root.querySelectorAll('[data-w],[data-off]')];
  els.forEach(el=>{el.style.transition='none';if(el.dataset.w!=null)el.style.width='0%';else el.style.strokeDashoffset=el.dataset.full});
  root.offsetHeight;
  setTimeout(()=>els.forEach((el,i)=>{el.style.transition='';el.style.transitionDelay=(i*45)+'ms';
    if(el.dataset.w!=null)el.style.width=el.dataset.w;else el.style.strokeDashoffset=el.dataset.off;
    setTimeout(()=>{el.style.transitionDelay=''},1600)}),delay);
}
fillIn(grid,300);
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&!curId)fillIn(grid,250)});

const tilesHtml=()=>`<h3>Schnell eintragen</h3><div class="tiles">${TILES.map(([k,t])=>`<button class="tile" data-t="${t}">${ico(k,'var(--acc)')}${t}</button>`).join('')}</div>`;
const mods=window.Modules||{};
function glances(){for(const a of AREAS){const m=mods[a.id];if(!m||!m.glance)continue;try{const g=m.glance();const n=document.getElementById('num-'+a.id),h2=document.getElementById('hint-'+a.id);if(n)n.textContent=g.num;if(h2)h2.textContent=g.hint;const arc=document.getElementById('arc-'+a.id);if(arc){const off=R*(1-(g.ring||0));if(arc.dataset.off!=String(off)){arc.dataset.off=off;if(!arc.style.transition||arc.style.transition!=='none')arc.style.strokeDashoffset=off}}}catch(err){console.error(err)}}}
glances();setInterval(()=>{glances();if(curId&&!document.querySelector('#sheet.on'))refresh()},60000);

// Gedrückt-Gefühl: einfedern beim Antippen, zurückfedern beim Loslassen
const pressSel='.card,.tile,.cta,.back,#fab';
document.addEventListener('pointerdown',e=>{const el=e.target.closest(pressSel);if(el)el.classList.add('down')});
['pointerup','pointercancel','pointerleave'].forEach(t=>document.addEventListener(t,()=>document.querySelectorAll('.down').forEach(x=>x.classList.remove('down')),true));
document.addEventListener('scroll',()=>document.querySelectorAll('.down').forEach(x=>x.classList.remove('down')),true);

const sk=n=>Array.from({length:n},(_,i)=>`<div class="sk" style="width:${[92,70,84,58,76][i%5]}%"></div>`).join('');
const body={
  glance:a=>`
    <div class="panel"><h3>Jetzt dran</h3><div class="num big" style="color:${a.col}">–</div>${sk(2)}</div>
    <div class="panel"><h3>Danach</h3>
      ${['08:00','12:30','16:00'].map(t=>`<div class="row"><div class="t">${t}</div><div class="f">${sk(1)}</div></div>`).join('')}</div>
    <button class="cta" data-toast="Erledigt ✓">Erledigt</button>`,
  read:a=>['Montag','Dienstag','Mittwoch','Donnerstag','Freitag','Samstag','Sonntag'].map(d=>`
    <div class="panel"><h3>${d}</h3>${sk(4)}</div>`).join(''),
  data:a=>`
    <div class="seg" id="seg"><i></i>${['Woche','Monat','Jahr'].map((s,i)=>`<button class="${i?'':'on'}" data-i="${i}">${s}</button>`).join('')}</div>
    <div class="panel"><h3>Verlauf</h3><div class="bars" id="bars">${Array.from({length:12},()=>'<div style="height:4%"></div>').join('')}</div>
      <div class="ax"><span>Start</span><span>Heute</span></div></div>
    <div class="panel"><h3>Auswertung</h3>${sk(5)}</div>`
};
const shuffleBars=()=>document.querySelectorAll('#bars div').forEach((b,i)=>{b.style.transitionDelay=i*25+'ms';b.style.height=(20+Math.random()*75)+'%'});

let from=null,curId=null;
function safeRender(id){try{return mods[id].render()}catch(err){console.error(err);return '<div class="panel"><h3>Fehler</h3><p class="mini">'+String(err.message||err)+'</p></div>'}}
function refresh(){glances();if(curId&&mods[curId]){const b=document.getElementById('modBody');if(b)b.innerHTML=safeRender(curId)}}
const clipOf=r=>`inset(${r.top}px ${innerWidth-r.right}px ${innerHeight-r.bottom}px ${r.left}px round 22px)`;

function openArea(card){
  const a=AREAS.find(x=>x.id===card.dataset.id);
  buzz();
  det.innerHTML=`<div class="dh"><button class="back" aria-label="Zurück">${ico(a.type==='read'?'back':'down')}</button><div class="small">${a.title}</div></div>
    <div class="db"><h1 class="big">${a.title}</h1>${mods[a.id]?'':`<p class="sub">${a.hint} · Platzhalter</p>`}<div id="modBody">${mods[a.id]?safeRender(a.id):body[a.type](a)}</div></div>`;
  curId=a.id;
  from=card;
  det.className='on';det.scrollTop=0;det.style.transform='';
  det.style.transition='none';det.style.clipPath=clipOf(card.getBoundingClientRect());
  det.offsetHeight;
  det.style.transition='clip-path .55s var(--spring)';det.style.clipPath='inset(0px 0px 0px 0px round 0px)';
  document.body.classList.add('open');
  fillIn(det,0);
  setTimeout(()=>{det.classList.add('ready');fillIn(det,180);if(a.type==='data')shuffleBars()},120);
}
function closeArea(){
  if(!from)return;
  buzz();
  det.classList.remove('ready','scrolled');
  det.style.transition='clip-path .5s var(--spring),transform .5s var(--spring)';
  det.style.transform='';
  det.style.clipPath=clipOf(from.getBoundingClientRect());
  document.body.classList.remove('open');
  const done=()=>{det.className='';det.innerHTML='';from=null;curId=null;fillIn(grid,0)};
  setTimeout(done,480);
}

grid.addEventListener('click',e=>{const c=e.target.closest('.card');if(c)openArea(c)});
det.addEventListener('click',e=>{
  if(e.target.closest('.back'))return closeArea();
  if(curId&&mods[curId]&&mods[curId].click&&mods[curId].click(e))return;
  const t=e.target.closest('[data-toast]');if(t){buzz();showToast(t.dataset.toast);return}
  const s=e.target.closest('.seg button');
  if(s){buzz();const seg=$('#seg');seg.querySelectorAll('button').forEach(b=>b.classList.toggle('on',b===s));
    seg.querySelector('i').style.transform=`translateX(${s.dataset.i*100}%)`;shuffleBars()}
});
det.addEventListener('scroll',()=>det.classList.toggle('scrolled',det.scrollTop>50));

// Nach unten ziehen (ganz oben) schließt die Detailansicht
let y0=null,dy=0;
det.addEventListener('touchstart',e=>{y0=det.scrollTop<=0?e.touches[0].clientY:null;dy=0},{passive:true});
det.addEventListener('touchmove',e=>{
  if(y0===null)return;dy=e.touches[0].clientY-y0;
  if(dy>0){e.preventDefault();det.style.transition='none';det.style.transform=`translateY(${dy*.55}px) scale(${1-Math.min(dy,400)/2500})`;det.style.clipPath=`inset(0px round ${Math.min(dy/6,28)}px)`}
},{passive:false});
det.addEventListener('touchend',()=>{
  if(y0===null)return;y0=null;
  if(dy>110)closeArea();
  else{det.style.transition='transform .5s var(--spring),clip-path .5s var(--spring)';det.style.transform='';det.style.clipPath='inset(0px round 0px)'}
});

// Schnell-Eintragen-Sheet
const openSheet=(html)=>{if(!sheet.classList.contains('on'))buzz();$('#sheetBody').innerHTML=html||tilesHtml();sheet.style.transform='';sheet.classList.add('on');scrim.classList.add('on')};
const closeSheet=()=>{sheet.style.transition='';sheet.style.transform='';sheet.classList.remove('on');scrim.classList.remove('on')};
$('#fab').addEventListener('click',()=>openSheet());
scrim.addEventListener('click',closeSheet);
sheet.addEventListener('click',e=>{const t=e.target.closest('.tile');
  if(t){buzz();closeSheet();if(t.dataset.t==='Mahlzeit'){const c=grid.querySelector('[data-id=essen]');setTimeout(()=>openArea(c),200)}else setTimeout(()=>showToast(t.dataset.t+' – kommt später'),250);return}
  if(curId&&mods[curId]&&mods[curId].click)mods[curId].click(e)});
let s0=null,sd=0;
sheet.addEventListener('pointerdown',e=>{if(!e.target.closest('.grab'))return;s0=e.clientY;sd=0;sheet.setPointerCapture(e.pointerId)});
sheet.addEventListener('pointermove',e=>{if(s0===null)return;sd=Math.max(0,e.clientY-s0);sheet.style.transition='none';sheet.style.transform=`translateY(${sd}px)`});
sheet.addEventListener('pointerup',()=>{if(s0===null)return;s0=null;sheet.style.transition='';if(sd>80)closeSheet();else sheet.style.transform=''});

let tt;
window.Shell={refresh,toast:m=>showToast(m),buzz:()=>buzz(),sheet:h=>openSheet(h),closeSheet:()=>closeSheet()};
function showToast(m){toast.textContent=m;toast.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>toast.classList.remove('on'),1800)}
}
</script>
<script>if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}))</script>
</body>
</html>
